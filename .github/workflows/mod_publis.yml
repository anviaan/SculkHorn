name: Mod Publish

on: [ workflow_dispatch ]

env:
  JAVA_VERSION: 25
  MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
  CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
  MODRINTH_ID: BfFhIqA7
  CURSEFORGE_ID: 636227

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      mod_version: ${{ steps.gradle-env.outputs.mod_version }}
      release_name: ${{ steps.gradle-env.outputs.release_name }}
      game_versions: ${{ steps.gradle-env.outputs.game_versions }}

    steps:
      - name: Check Environment Variables
        run: env

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Set Environment Variables from Gradle
        id: gradle-env
        run: |
          ./gradlew printEnv
          echo "mod_version=$MOD_VERSION"       >> $GITHUB_OUTPUT
          echo "release_name=$RELEASE_NAME"     >> $GITHUB_OUTPUT
          echo "game_versions=$GAME_VERSIONS"   >> $GITHUB_OUTPUT

      - name: Build
        run: ./gradlew build

      - name: Upload Fabric JAR
        uses: actions/upload-artifact@v4
        with:
          name: fabric-jar
          path: fabric/build/libs/

      - name: Upload NeoForge JAR
        uses: actions/upload-artifact@v4
        with:
          name: neoforge-jar
          path: neoforge/build/libs/

  publish-fabric:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Fabric JAR
        uses: actions/download-artifact@v4
        with:
          name: fabric-jar
          path: fabric/build/libs/

      - name: Fabric Publish (Modrinth & CurseForge)
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ env.MODRINTH_ID }}
          modrinth-token: ${{ env.MODRINTH_TOKEN }}

          curseforge-id: ${{ env.CURSEFORGE_ID }}
          curseforge-token: ${{ env.CURSEFORGE_TOKEN }}

          files: |
            fabric/build/libs/!(*-@(dev|sources|javadoc|shadow)).jar

          name: ${{ needs.build.outputs.release_name }}
          version: ${{ needs.build.outputs.mod_version }}
          version-type: 'release'
          changelog-file: CHANGELOG.md

          game-versions: ${{ needs.build.outputs.game_versions }}

          loaders: |
            fabric
            quilt

          dependencies: |
            fabric-api
            anvians-lib

          java: ${{ env.JAVA_VERSION }}

  publish-neoforge:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download NeoForge JAR
        uses: actions/download-artifact@v4
        with:
          name: neoforge-jar
          path: neoforge/build/libs/

      - name: NeoForge Publish (Modrinth & CurseForge)
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ env.MODRINTH_ID }}
          modrinth-token: ${{ env.MODRINTH_TOKEN }}

          curseforge-id: ${{ env.CURSEFORGE_ID }}
          curseforge-token: ${{ env.CURSEFORGE_TOKEN }}

          files: |
            neoforge/build/libs/!(*-@(dev|sources|javadoc|shadow)).jar

          name: ${{ needs.build.outputs.release_name }}
          version: ${{ needs.build.outputs.mod_version }}
          version-type: 'release'
          changelog-file: CHANGELOG.md

          game-versions: ${{ needs.build.outputs.game_versions }}

          loaders: |
            neoforge

          dependencies: |
            anvians-lib

          java: ${{ env.JAVA_VERSION }}

  publish-maven:
    needs: [ publish-fabric, publish-neoforge ]
    if: success()
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Publish to Reposilite
        env:
          REPOSILITE_USER: ${{ secrets.REPOSILITE_USER }}
          REPOSILITE_TOKEN: ${{ secrets.REPOSILITE_TOKEN }}
        run: ./gradlew publish